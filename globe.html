<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratos 3D Earth // Real-Time Global Climate Sphere</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Three.js & Globe.gl 3D WebGL Engines -->
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body class="globe-page">

    <!-- Loading Screen -->
    <div class="globe-loader" id="globe-loader">
        <div class="globe-spinner"></div>
        <div class="globe-loader-text">Initializing 3D Atmosphere & Live Thermal Satellite Data...</div>
    </div>

    <!-- 3D WebGL Canvas Container -->
    <div id="globe-container"></div>

    <!-- Glass UI Layer Overlay -->
    <div class="globe-ui-layer">
        <!-- Top Nav -->
        <header class="top-nav">
            <!-- Left Side Stack: Logo, then Fly-To, then Globe Controls -->
            <div class="left-controls-stack">
                <a href="index.html" class="logo">Stratos<span>Weather</span></a>

                <div class="left-buttons-group">
                    <!-- 1. Fly To Dropdown Button -->
                    <div class="fly-to-dropdown-container">
                        <button class="glass-dropdown-btn" id="btn-fly-to-dropdown" type="button">
                            <span>⚡ Fly To City</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="glass-dropdown-menu" id="fly-to-menu">
                            <!-- Populated dynamically with global cities -->
                        </div>
                    </div>

                    <!-- 2. Globe Controls Dropdown Button (Relocated from bottom) -->
                    <div class="fly-to-dropdown-container">
                        <button class="glass-dropdown-btn" id="btn-controls-dropdown" type="button">
                            <span>⚙️ Globe Controls</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="glass-dropdown-menu controls-menu" id="controls-menu">
                            <button class="fly-to-item" id="btn-toggle-texture" type="button">
                                <span>🌙 Earth Texture</span>
                                <span class="fly-temp" id="texture-mode-label">City Lights</span>
                            </button>
                            <button class="fly-to-item" id="btn-toggle-arcs" type="button">
                                <span>💨 Jet Streams</span>
                                <span class="fly-temp" id="arcs-mode-label">Active</span>
                            </button>
                            <button class="fly-to-item" id="btn-toggle-spin" type="button">
                                <span>🔄 Auto-Spin</span>
                                <span class="fly-temp" id="spin-mode-label">On</span>
                            </button>
                            <button class="fly-to-item" id="btn-reset-view" type="button">
                                <span>🎯 Reset Camera</span>
                                <span class="fly-temp">Default</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center: Search Pill -->
            <div class="search-container">
                <div class="search-pill">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="city-input" placeholder="Search any city to fly to on Earth..." autocomplete="off">
                </div>
                <div id="autocomplete-list" class="autocomplete-suggestions glass"></div>
            </div>

            <!-- Right Corner: Single Navigation Dropdown + Controls -->
            <div class="right-corner-group">
                <!-- Single Navigation Menu Dropdown Button -->
                <div class="fly-to-dropdown-container">
                    <button class="glass-dropdown-btn" id="btn-nav-dropdown" type="button">
                        <span>🧭 Navigation</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                    <div class="glass-dropdown-menu nav-menu" id="nav-dropdown-menu">
                        <a href="index.html" class="fly-to-item">
                            <span>🌤️ Dashboard</span>
                        </a>
                        <a href="globe.html" class="fly-to-item active-page">
                            <span>🌐 3D Earth</span>
                            <span class="badge-active">Active</span>
                        </a>
                        <a href="analytics.html" class="fly-to-item">
                            <span>📊 Analytics</span>
                        </a>
                    </div>
                </div>

                <div class="nav-controls">
                    <button class="unit-toggle glass-btn" id="unit-toggle" title="Switch between °C and °F">°C</button>
                    <div class="time-box" id="current-time">12:00 PM</div>
                </div>
            </div>
        </header>

        <!-- Bottom Controls & Floating Panels -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%; position: relative;">
            
            <!-- Floating City Inspector Card -->
            <div class="globe-card hidden" id="globe-card">
                <div class="globe-card-header">
                    <div class="globe-card-title">
                        <h3 id="card-city-name">Tokyo</h3>
                        <p id="card-country-name">Japan</p>
                    </div>
                    <button class="globe-close-btn" id="card-close-btn" title="Close">×</button>
                </div>

                <div class="globe-card-temp">
                    <div class="temp-num"><span id="card-temp">24</span>°</div>
                    <div class="temp-condition" id="card-condition-icon">☀️</div>
                </div>

                <p style="font-size: 0.95rem; font-weight: 600; color: var(--accent);" id="card-condition-text">Sunny</p>

                <div class="globe-card-stats">
                    <div class="g-stat">
                        <span>Feels Like</span>
                        <strong id="card-feels-like">25°</strong>
                    </div>
                    <div class="g-stat">
                        <span>Wind Speed</span>
                        <strong id="card-wind">12 km/h</strong>
                    </div>
                    <div class="g-stat">
                        <span>Humidity</span>
                        <strong id="card-humidity">58%</strong>
                    </div>
                    <div class="g-stat">
                        <span>UV Index</span>
                        <strong id="card-uv">4</strong>
                    </div>
                </div>

                <a href="#" id="card-open-dashboard" class="globe-action-btn">Open Full Forecast in Dashboard →</a>
            </div>

            <!-- Temperature Heatmap Legend -->
            <div class="globe-legend" id="globe-legend" style="margin-left: auto;">
                <div class="globe-legend-title">
                    <span>Global Temperature</span>
                    <span id="legend-unit">°C</span>
                </div>
                <div class="globe-legend-bar"></div>
                <div class="globe-legend-labels">
                    <span id="legend-min">< 0°</span>
                    <span id="legend-mid">18°</span>
                    <span id="legend-max">> 35°</span>
                </div>
            </div>

        </div>
    </div>

    <script src="globe.js"></script>
</body>
</html>
